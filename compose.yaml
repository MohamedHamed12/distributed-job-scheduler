services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: job_scheduler
      POSTGRES_USER: job_scheduler
      POSTGRES_PASSWORD: job_scheduler
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_scheduler -d job_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
